[package]
name = "navifs-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local, offline sentence embeddings for NaviFS (BGE-small on the pure-Rust candle runtime)"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
navifs-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true

candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde_json.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
