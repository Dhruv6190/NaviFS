[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/database",
    "crates/indexer",
    "crates/extract",
    "crates/search",
    "crates/graph",
    "crates/mcp",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NaviFS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/navifs/navifs"
readme = "README.md"
description = "NaviFS: Local-first file system intelligent engine exposed via Model Context Protocol (MCP)"

[workspace.dependencies]
# Internal workspace crates
navifs-core = { path = "crates/core" }
navifs-database = { path = "crates/database" }
navifs-indexer = { path = "crates/indexer" }
navifs-extract = { path = "crates/extract" }
navifs-search = { path = "crates/search" }
navifs-graph = { path = "crates/graph" }
navifs-mcp = { path = "crates/mcp" }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Asynchronous Runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Identifiers & Cryptography
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Filesystem & Persistence
notify = "6.1"
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
