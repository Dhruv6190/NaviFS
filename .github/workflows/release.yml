name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: navifs.exe
            archive: navifs-x86_64-pc-windows-msvc.zip

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: navifs
            archive: navifs-x86_64-unknown-linux-gnu.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: navifs
            archive: navifs-aarch64-apple-darwin.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            binary: navifs
            archive: navifs-x86_64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p navifs-daemon

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          Compress-Archive -Path $bin, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath ${{ matrix.archive }}

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          tar -czf "${{ matrix.archive }}" -C "$(dirname "$bin")" "$(basename "$bin")" README.md LICENSE-MIT LICENSE-APACHE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish-release:
    name: Publish Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
